<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff7fb" />
  <title>KIA SOUL — Learn &amp; Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" />
  <style>
    :root{--pink:#ff86aa;--pink2:#ffd7e3;--hot:#ff5f80;--red:#ff3e48;--yellow:#ffd94f;--blue:#42b6ff;--ink:#40333a;--paper:#fffdfd;--shadow:0 18px 40px rgba(130,55,85,.16)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#fff7fb}
    button,input{font:inherit}
    button{cursor:pointer;border:0}
    .app{max-width:1080px;margin:auto;min-height:100vh;padding:16px 16px 84px}
    .home-screen{min-height:calc(100vh - 30px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 36px}
    .brand-mark{display:flex;gap:10px;align-items:center;margin-top:8px}
    .kia{font-family:Arial,sans-serif;font-weight:900;letter-spacing:2px;border:3px solid #182433;color:#182433;border-radius:50%;padding:4px 13px}
    .soul{font-size:3rem;font-weight:800;letter-spacing:-3px;color:#172332}
    .home-badge,.progress-pill{background:#fff;border:2px solid #ffd2df;border-radius:999px;padding:5px 13px;font-weight:800;color:#d75578}
    .home-screen h1{font-size:clamp(2rem,6vw,3.8rem);line-height:.98;color:#ef5f86;margin:16px 0 4px}
    .lead{margin:0 auto 18px;max-width:580px;font-size:1.12rem;color:#806b75}
    .hero-photo{position:relative;width:min(780px,96vw);height:min(48vw,360px);min-height:220px;border-radius:34px;overflow:hidden;box-shadow:var(--shadow);border:5px solid white;background:#111}
    .hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-frame img{width:100%;height:100%;object-fit:fill;display:block}
    .photo-sheen{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 38%,rgba(255,111,151,.08));pointer-events:none}
    .mode-grid{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}
    .mode-card{background:#fff;border-radius:28px;padding:20px;box-shadow:var(--shadow);min-height:220px;transition:.18s transform}
    .mode-card:hover{transform:translateY(-4px)}
    .mode-card strong{display:block;font-size:1.5rem}
    .mode-card small{display:block;color:#8d7680;max-width:280px;margin:auto}
    .stack-cards{height:90px;position:relative}
    .stack-cards span{position:absolute;width:72px;height:92px;border-radius:15px;border:6px solid;left:50%;top:0}
    .stack-cards span:nth-child(1){transform:translateX(-72px) rotate(-15deg);background:#9cdbff;border-color:#3db8ff}
    .stack-cards span:nth-child(2){transform:translateX(-37px) rotate(0);background:#fff0a9;border-color:#ffd43c}
    .stack-cards span:nth-child(3){transform:translateX(-2px) rotate(15deg);background:#ff91a6;border-color:#ff4666}
    .exam-icon{width:84px;height:84px;border-radius:50%;background:#dff4ff;border:6px solid #4abaff;color:#1b9de3;font-size:3rem;font-weight:900;margin:3px auto 14px}
    .home-stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:#8d7680;margin:2px 0 15px}
    .secondary-btn{background:#fff;border:2px solid #ffd2df;border-radius:18px;padding:12px 18px;color:#db5b7c;font-weight:800;box-shadow:0 8px 20px rgba(130,55,85,.08)}
    .page{min-height:100vh;padding:4px 0 18px}
    .topbar{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;margin-bottom:10px}
    .icon-btn{width:44px;height:44px;border-radius:15px;background:#fff;box-shadow:0 7px 18px rgba(130,55,85,.1);font-size:1.5rem;color:#7a6570}
    .brand-mini{font-size:.76rem;font-weight:800;color:#7e6873}
    .brand-mini span{font-weight:500;color:#b0919d}
    .topbar h1{margin:0;color:#ef5f86;font-size:1.65rem}
    .top-right{justify-self:end}
    .hint,.mistake-sub{text-align:center;color:#8d7680;margin:0 0 12px}
    .review-stage{display:flex;flex-direction:column;align-items:center;gap:15px}
    .photo-frame{position:relative;width:min(850px,100%);aspect-ratio:var(--ar,4/3);max-height:72vh;background:#111;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);border:5px solid #fff;margin:auto}
    .photo-frame:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);pointer-events:none}
    .scene-label{position:absolute;left:14px;top:14px;background:rgba(13,25,38,.78);color:white;border-radius:999px;padding:5px 12px;font-size:.82rem;z-index:4}
    .review-card{width:min(620px,96%);background:#fff;border-radius:28px;padding:18px 20px 20px;box-shadow:var(--shadow);text-align:center}
    .card-number,.question-small{font-size:.76rem;letter-spacing:1.5px;color:#a77f8c;font-weight:800}
    .review-card h2{margin:4px 0;font-size:1.8rem}
    .review-card h2 span{color:#ef5f86}
    .review-card p{margin:0 0 10px;color:#8d7680}
    .yellow-btn{background:var(--yellow);color:#4e3f25;border-radius:17px;padding:11px 18px;font-weight:900;box-shadow:0 7px 16px rgba(255,217,79,.25)}
    .bottom-nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(620px,94vw);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.95);border:2px solid #ffdce6;border-radius:24px;padding:5px;box-shadow:0 12px 32px rgba(100,50,70,.15);z-index:20}
    .bottom-nav button{background:transparent;border-radius:18px;padding:8px 5px;color:#987783;font-weight:800}
    .bottom-nav button.active{background:#fff0f4;color:#e55779}
    .explain-overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px}
    .cloud-backdrop{position:absolute;inset:0;background:rgba(29,35,45,.38);backdrop-filter:blur(4px)}
    .cloud-card{position:relative;width:min(520px,94vw);display:flex;align-items:center;gap:10px;animation:cloudIn .28s ease}
    .cloud-face{width:100px;height:78px;display:grid;place-items:center;background:#fff;border-radius:50% 50% 44% 56%;font-size:2.4rem;box-shadow:var(--shadow);flex:none}
    .cloud-body{background:#fff;border-radius:30px 36px 42px 30px;padding:18px 20px;box-shadow:var(--shadow);position:relative}
    .cloud-body:before{content:'';position:absolute;left:-14px;bottom:16px;border-width:10px 16px 10px 0;border-style:solid;border-color:transparent white transparent transparent}
    .mini-tag{font-size:.72rem;letter-spacing:1px;color:#a27c89;font-weight:900}
    .cloud-body h2{margin:0;color:#ef5f86;font-size:1.65rem}
    .cloud-body p{font-size:1.05rem;line-height:1.25;margin:5px 0 12px}
    .exam-page{position:relative}
    .exam-meta{display:flex;align-items:center;gap:8px}
    .hearts{color:#ff5579;letter-spacing:2px;font-size:1.2rem}
    .exam-instruction{text-align:center;font-size:1.2rem;font-weight:900;color:#795f6a;margin:3px 0 7px}
    .game-photo{width:min(920px,100%);max-height:69vh;margin:auto}
    .question-card{position:relative;z-index:8;width:min(450px,88vw);margin:-42px auto 0;background:#fff;border:3px solid #ffd6e2;border-radius:28px;padding:12px 20px 17px;text-align:center;box-shadow:0 18px 38px rgba(95,45,65,.2);animation:cardRise .35s ease}
    .drag-handle{width:40px;height:5px;border-radius:10px;background:#e8ccd6;margin:0 auto 8px}
    .question-name{font-size:1.75rem;font-weight:900;color:#ef5f86}
    .exam-tip{text-align:center;color:#9b7c88;margin:9px 0 60px}
    .countdown-screen{position:fixed;inset:0;background:radial-gradient(circle at center,#fff,#ffdce8);display:grid;place-items:center;text-align:center;z-index:200}
    .count-label{position:absolute;top:32%;font-weight:900;color:#b36d83;letter-spacing:3px}
    .count-go{position:absolute;bottom:30%;font-weight:900;color:#ef5f86}
    .countdown-screen #count-number{font-size:clamp(6rem,24vw,13rem);font-weight:900;color:#ef5f86;animation:countPop .75s ease}
    .feedback{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(255,255,255,.24);backdrop-filter:blur(2px)}
    .feedback-card{width:min(430px,90vw);background:#fff;border-radius:30px;padding:24px;text-align:center;box-shadow:0 22px 55px rgba(100,50,70,.25);animation:cardRise .28s ease}
    .feedback-title{font-size:2.35rem;font-weight:900;color:#ef5f86}
    .feedback-name{font-size:1.25rem;font-weight:800;margin:0 0 15px}
    .burst{position:absolute;top:24%;font-size:2rem;letter-spacing:22px;color:#ff6e91;animation:burst 1s ease-out}
    .heart-pop{position:absolute;left:50%;top:48%;font-size:1.8rem;color:#ff5f80;animation:heartFly 1.15s ease-out forwards;transform:translate(0,0)}
    .mistake-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px auto;max-width:900px}
    .mistake-card{background:#fff;border:2px solid #ffdce6;border-radius:24px;padding:17px;text-align:left;box-shadow:0 9px 22px rgba(100,50,70,.08);transition:.16s transform}
    .mistake-card:hover{transform:translateY(-3px)}
    .mistake-icon{font-size:1.8rem;display:block}
    .mistake-card span:nth-child(2){font-weight:900;font-size:1.15rem;display:block;color:#ef5f86}
    .mistake-card small{color:#a1808b}
    .mistake-view{position:relative;z-index:2;width:min(900px,96vw);display:grid;grid-template-columns:1.35fr .65fr;gap:15px;align-items:center}
    .mistake-info{background:#fff;border-radius:30px;padding:25px;box-shadow:var(--shadow)}
    .mistake-info h2{color:#ef5f86;margin:0}
    .mistake-info p{line-height:1.35}
    .results{display:grid;place-items:center}
    .result-card{width:min(500px,94vw);background:#fff;border-radius:34px;padding:35px;text-align:center;box-shadow:var(--shadow)}
    .result-emoji{font-size:4rem}
    .result-card h2{color:#ef5f86;font-size:2.2rem;margin:0}
    .result-score{font-size:4rem;font-weight:900;color:#42aee8}
    .result-card .secondary-btn{margin-top:12px;width:100%}
    @keyframes cloudIn{from{transform:scale(.82) translateY(20px);opacity:0}to{transform:none;opacity:1}}
    @keyframes countPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1)}}
    @keyframes cardRise{from{transform:translateY(70px) scale(.96);opacity:0}to{transform:none;opacity:1}}
    @keyframes heartFly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
    @keyframes burst{from{transform:scale(.4);opacity:0}45%{transform:scale(1.2);opacity:1}to{transform:scale(1.5);opacity:0}}
    @media(max-width:680px){.app{padding:10px 10px 80px}.hero-photo{height:55vw;min-height:200px;border-radius:25px}.mode-grid{gap:10px}.mode-card{min-height:190px;padding:14px}.mode-card strong{font-size:1.25rem}.stack-cards{height:72px;transform:scale(.78)}.exam-page .topbar h1{font-size:1.4rem}.photo-frame{height:61vw;min-height:260px;border-radius:24px}.game-photo{height:58vh;min-height:330px}.question-card{margin-top:-28px}.mistake-view{grid-template-columns:1fr}.cloud-card{align-items:flex-end}.cloud-face{width:76px;height:62px;font-size:1.8rem}.cloud-body{padding:15px}.cloud-body h2{font-size:1.4rem}}
    .explain-photo{position:absolute;width:min(900px,94vw);aspect-ratio:var(--ar,4/3);max-height:62vh;top:8vh;left:50%;transform:translateX(-50%);border-radius:30px;overflow:hidden;border:5px solid #fff;box-shadow:0 20px 55px rgba(30,40,50,.28);z-index:2;background:#111}
    .explain-photo img{width:100%;height:100%;object-fit:fill;display:block}
    .explain-overlay .cloud-card{z-index:5;margin-top:min(45vh,380px);max-width:600px}
    .feedback-lite{background:transparent;pointer-events:none;backdrop-filter:none}
    .feedback-lite .praise{position:fixed;left:50%;top:42%;z-index:140}
    .wrong-bubble{background:#fff;border:4px solid #ff9ab2;color:#ef5f86;border-radius:30px;padding:16px 28px;box-shadow:var(--shadow);font-size:2rem;font-weight:900;animation:cloudIn .25s ease}
    .wrong-bubble small{display:block;font-size:1rem;color:#8d7680;text-align:center;margin-top:-4px}
    .card-drop{animation:cardDrop .48s cubic-bezier(.7,-.15,.85,.35) forwards}
    @keyframes cardDrop{to{transform:translateY(180px) rotate(5deg);opacity:0}}
    .question-card{transition:transform .2s,opacity .2s}
    @media(max-width:680px){.explain-photo{top:7vh;max-height:48vh;border-radius:24px}.explain-overlay .cloud-card{margin-top:28vh;align-items:flex-end}.wrong-bubble{font-size:1.55rem}}
    .tap-layer{position:absolute;inset:0;z-index:8;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
    .hl-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:5;pointer-events:none;opacity:0;transition:opacity .35s ease;user-select:none;-webkit-user-drag:none}
    .hl-img.on{opacity:1;filter:drop-shadow(0 0 5px rgba(255,217,79,.85));animation:hlGlow 1.3s ease-in-out 2}
    @keyframes hlGlow{50%{filter:drop-shadow(0 0 14px rgba(255,217,79,1))}}
    @media(prefers-reduced-motion:reduce){.hl-img{transition:none}.hl-img.on{animation:none}}
    .invisible-hit{position:absolute;margin:0;padding:0;border:0;background:transparent!important;outline:none;box-shadow:none;z-index:8;cursor:pointer;appearance:none;-webkit-tap-highlight-color:transparent;}
    .invisible-hit:hover,.invisible-hit:focus,.invisible-hit:active{background:transparent!important;border:0!important;outline:none!important;box-shadow:none!important;}
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <script>
  /*
    KIA SOUL 2015 — photographic flashcard app
    Language: Mexican Spanish UI, English component names.
    Photos: assets/base/   Sounds: assets/sounds/
    Each card's box is [left%, right%, top%, bottom%] over its photo.
  */

  const SCENES = {
    wheel: {image:'assets/base/wheel.jpg', w:800, h:600, title:'Steering Wheel Area'},
    console: {image:'assets/base/console.jpg', w:800, h:600, title:'Center Stack'},
    shifter: {image:'assets/base/shifter.jpg', w:800, h:600, title:'Gear Shifter Console'},
    cabin: {image:'assets/base/cabin.jpg', w:800, h:600, title:'Full Cabin'},
    dash: {image:'assets/base/dash.jpg', w:1600, h:1200, title:'Driver Dashboard'},
    side: {image:'assets/base/side.jpg', w:1600, h:1200, title:'Cabin Wide View'},
  };

  const ALL_CARDS = [
    {id:1, scene:'wheel', mask:'assets/masks/steering-wheel.png', name:'Steering Wheel', explanation:'Te ayuda a dirigir el carro hacia la izquierda o la derecha.', box:[28.25,64.38,7.5,56.67]},
    {id:2, scene:'wheel', mask:'assets/masks/fuse-panel-cover.png', name:'Fuse Panel Cover', explanation:'Cubre los fusibles que protegen los circuitos eléctricos del carro.', box:[4.88,20.38,60.0,78.5]},
    {id:3, scene:'wheel', mask:'assets/masks/brake-pedal.png', name:'Brake Pedal', explanation:'Al presionarlo, el carro disminuye la velocidad o se detiene.', box:[22.0,29.12,82.17,99.83]},
    {id:4, scene:'wheel', mask:'assets/masks/dimmer-esc-switches.png', name:'Dimmer / ESC Off Switches', explanation:'Ajustan el brillo del tablero o desactivan el control de estabilidad.', box:[13.38,19.5,48.33,55.33]},
    {id:5, scene:'wheel', mask:'assets/masks/accelerator-pedal.png', name:'Accelerator Pedal', explanation:'Al presionarlo, el motor aumenta la fuerza para avanzar más rápido.', box:[13.25,21.88,87.67,97.33]},
    {id:6, scene:'console', name:'Climate Mode Button', explanation:'Elige hacia dónde sale el aire: cara, pies, parabrisas o combinaciones.', box:[59.12,67.88,52.33,58.67]},
    {id:7, scene:'console', name:'Front Defrost Button', explanation:'Dirige aire caliente al parabrisas delantero para desempañarlo.', box:[36.12,45.5,54.0,61.67]},
    {id:8, scene:'console', name:'Tune / Enter Knob', explanation:'Gira para buscar estaciones o navegar los menús del sistema de audio.', box:[68.88,74.0,35.83,42.5]},
    {id:9, scene:'console', name:'Climate Power / Recirculation Button', explanation:'Enciende el clima o recircula el aire interior en vez de tomar aire de afuera.', box:[59.0,63.0,59.33,65.67]},
    {id:10, scene:'console', name:'Fan Speed Button', explanation:'Ajusta qué tan fuerte circula el aire dentro del carro.', box:[25.25,36.25,55.17,71.17]},
    {id:11, scene:'console', name:'Rear Defroster Button', explanation:'Ayuda a quitar humedad o hielo de la ventana trasera.', box:[33.5,45.25,61.5,70.33]},
    {id:12, scene:'console', name:'Auto Climate Dial', explanation:'Gira este control para subir o bajar la temperatura automáticamente.', box:[48.88,59.0,52.83,69.67]},
    {id:13, scene:'console', name:'Climate On/Off Button', explanation:'Enciende o apaga por completo el sistema de clima.', box:[63.12,67.88,58.0,64.67]},
    {id:14, scene:'console', name:'A/C Button', explanation:'Enciende o apaga el aire acondicionado.', box:[56.88,64.62,52.5,58.83]},
    {id:15, scene:'console', name:'Touchscreen Display', explanation:'Muestra el radio, la hora y las opciones de conectividad del carro.', box:[25.12,70.5,3.0,46.0]},
    {id:16, scene:'shifter', name:'Shift Position Display', explanation:'Muestra en qué posición está la transmisión: Park, Reversa, Neutral o Drive.', box:[36.62,55.88,45.0,79.0]},
    {id:17, scene:'shifter', name:'12V Power Outlet Panel', explanation:'Permite conectar accesorios eléctricos compatibles de 12 voltios.', box:[16.12,36.12,22.67,38.17]},
    {id:18, scene:'shifter', name:'Gear Shifter Knob', explanation:'Selecciona la posición de la transmisión para mover el carro.', box:[39.5,65.88,16.17,78.5]},
    {id:19, scene:'cabin', name:'Parking Brake Handle', explanation:'Mantiene el carro detenido cuando está estacionado.', box:[22.88,39.25,70.5,89.67]},
    {id:20, scene:'cabin', name:'Audio Volume Knob', explanation:'Gira para subir o bajar el volumen del sistema de audio.', box:[53.88,67.0,35.17,43.0]},
    {id:21, scene:'cabin', name:'Ignition Key Cylinder', explanation:'Aquí se inserta la llave para encender el motor.', box:[39.62,44.12,31.33,36.5]},
    {id:22, scene:'cabin', name:'Center Console & Cup Holders', explanation:'Espacio de almacenamiento y sostiene vasos o botellas.', box:[24.5,46.62,82.33,99.83]},
    {id:23, scene:'cabin', name:'Driver Door Handle', explanation:'Se usa para abrir la puerta del conductor desde adentro.', box:[5.25,19.38,33.5,37.33]},
    {id:24, scene:'dash', name:'Cruise Control Buttons', explanation:'Si está equipado, ayuda a mantener una velocidad seleccionada sin usar el acelerador.', box:[52.94,59.69,59.0,67.58]},
    {id:25, scene:'dash', name:'Hazard Warning Button', explanation:'Activa las luces intermitentes para avisar de una situación de emergencia.', box:[73.88,77.0,32.33,37.5]},
    {id:26, scene:'dash', name:'Infotainment System', explanation:'Sistema central de audio, teléfono y navegación del carro.', box:[68.94,83.38,44.58,55.67]},
    {id:27, scene:'dash', name:'Instrument Cluster', explanation:'Aquí ves información como velocidad, combustible y luces de advertencia.', box:[33.0,49.69,37.33,52.75]},
    {id:28, scene:'dash', name:'Steering Wheel Audio Controls', explanation:'Permiten controlar algunas funciones de audio desde el volante.', box:[18.06,28.56,68.08,77.5]},
    {id:29, scene:'dash', name:'Turn Signal Stalk', explanation:'Indica a los demás que vas a dar vuelta o cambiar de carril.', box:[19.25,32.94,56.75,60.42]},
    {id:30, scene:'dash', name:'Driver Airbag Module', explanation:'Protege al conductor en ciertas colisiones.', box:[22.38,53.5,54.92,98.67]},
    {id:31, scene:'dash', name:'Wiper / Washer Stalk', explanation:'Controla los limpiaparabrisas y ayuda a limpiar el parabrisas.', box:[54.56,61.56,53.0,56.83]},
    {id:32, scene:'side', name:'Passenger Door Handle', explanation:'Permite abrir la puerta del pasajero desde adentro.', box:[76.75,84.75,18.83,24.83]},
    {id:33, scene:'side', name:'Dashboard Speaker', explanation:'Bocina integrada en el tablero para el sistema de audio.', box:[21.81,40.38,11.5,16.33]},
    {id:34, scene:'wheel', mask:'assets/masks/light-turn-signal-stalk.png', name:'Light & Turn Signal Stalk', explanation:'Sirve para prender las luces y para avisar con las direccionales cuando vas a dar vuelta.', box:[26.75, 33.88, 29.33, 41.0]},
    {id:35, scene:'wheel', mask:'assets/masks/gear-shift-lever.png', name:'Gear Shift Lever', explanation:'Sirve para cambiar la posición de la transmisión: estacionar, reversa, neutral o manejar.', box:[62.12, 77.0, 51.33, 71.5]},
    {id:36, scene:'wheel', mask:'assets/masks/passenger-side-mirror.png', name:'Passenger Side Mirror', explanation:'Te deja ver lo que viene al lado y atrás del carro, del lado del pasajero.', box:[80.5, 92.62, 9.67, 20.33]},
    {id:37, scene:'wheel', mask:'assets/masks/driver-seat.png', name:'Driver Seat', explanation:'Es donde te sientas para manejar. Se puede ajustar para que estés cómodo y alcances los controles.', box:[40.38, 100.0, 19.67, 100.0]},
    {id:38, scene:'wheel', mask:'assets/masks/airbag-horn-pad.png', name:'Airbag Module & Horn Pad', explanation:'Al presionarlo suena el claxon. Además, guarda la bolsa de aire que te protege en un choque.', box:[39.38, 55.38, 25.83, 45.83]},
    {id:39, scene:'wheel', mask:'assets/masks/tilt-telescopic-lever.png', name:'Tilt & Telescopic Steering Lever', explanation:'Al soltarla puedes subir, bajar o acercar el volante para manejar más cómodo.', box:[28.12, 37.38, 50.17, 54.5]},
    {id:40, scene:'wheel', mask:'assets/masks/interior-door-handle.png', name:'Interior Passenger Door Handle', explanation:'Se jala para abrir la puerta del pasajero desde adentro.', box:[89.25, 98.75, 32.33, 39.5]},
  ];

  // Only the photos listed here are in the game for now. Add 'console', 'shifter', 'cabin', 'dash', 'side' later.
  const ACTIVE_SCENES = ['wheel'];
  const CARDS = ALL_CARDS.filter(c=>ACTIVE_SCENES.includes(c.scene));

  function cardsForScene(scene){ return CARDS.filter(c=>c.scene===scene); }

  // Invisible tap areas placed over each part in the photo.
  // ---- Tap detection ----------------------------------------------------
  // One invisible layer over the photo. A tap picks the part whose mask (or box,
  // for parts without a mask yet) is under the finger, or the nearest one within
  // FINGER_PX of it, so small parts stay easy to hit on a phone.
  const FINGER_PX = 22;
  const maskData = {};   // url -> {w,h,a:Uint8ClampedArray,area} (null if unreadable)
  function loadMask(url){
    if(url in maskData) return;
    maskData[url] = null;
    const img = new Image();
    img.onload = () => { try{
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0);
      const d = x.getImageData(0,0,c.width,c.height).data, a = new Uint8Array(c.width*c.height); let area = 0;
      for(let i=0;i<a.length;i++){ a[i]=d[i*4+3]; if(a[i]>128) area++; }
      maskData[url] = {w:c.width,h:c.height,a,area};
    }catch(e){ maskData[url] = null; } };
    img.src = url;
  }
  CARDS.forEach(c=>{ if(c.mask) loadMask(c.mask); });

  // distance (in image px) from point to the part, plus its area for tie-breaks
  function distToCard(c, s, x, y, r){
    const m = c.mask && maskData[c.mask];
    if(m){
      let best = Infinity; const R = Math.ceil(r), x0=Math.max(0,Math.floor(x)-R), x1=Math.min(m.w-1,Math.floor(x)+R), y0=Math.max(0,Math.floor(y)-R), y1=Math.min(m.h-1,Math.floor(y)+R);
      for(let yy=y0; yy<=y1; yy++) for(let xx=x0; xx<=x1; xx++){
        if(m.a[yy*m.w+xx]>128){ const d=Math.hypot(xx-x,yy-y); if(d<best) best=d; }
      }
      return {d:best, area:m.area};
    }
    const l=c.box[0]/100*s.w, rr=c.box[1]/100*s.w, t=c.box[2]/100*s.h, b=c.box[3]/100*s.h;
    return {d:Math.hypot(Math.max(l-x,0,x-rr), Math.max(t-y,0,y-b)), area:(rr-l)*(b-t)};
  }
  function hitTest(scene, nx, ny, cssWidth, preferId){
    const s = SCENES[scene], x = nx*s.w, y = ny*s.h, r = FINGER_PX/(cssWidth/s.w);
    const near = [];
    cardsForScene(scene).forEach(c=>{ const h = distToCard(c,s,x,y,r); if(h.d<=r) near.push({card:c,d:h.d,area:h.area}); });
    if(!near.length) return null;
    const pref = near.find(n=>n.card.id===preferId && n.d<=0.5);
    if(pref) return pref.card;
    const inside = near.filter(n=>n.d<=0.5).sort((a,b)=>a.area-b.area)[0];
    // inside a big part (e.g. the seat) but a much smaller part is within finger reach: take the small one
    const small = near.filter(n=>n!==inside && (!inside || n.area<inside.area/6)).sort((a,b)=>a.d-b.d)[0];
    if(inside) return (small ? small : inside).card;
    // nothing under the finger: nearest wins, but big parts (seat) count as farther than small ones
    const eff = n => n.d*(1+n.area/10000);
    return near.sort((a,b)=>eff(a)-eff(b))[0].card;
  }
  function hitLayer(p, mode){
    return `<div class="tap-layer" data-mode="${mode}" data-scene="${p.scene}" data-pid="${p.id}"></div>`;
  }
  // The approved yellow highlight for a card (fades in when its part is chosen).
  function highlightLayer(p, on=false){
    return p.mask ? `<img class="hl-img${on?' on':''}" src="${p.mask}" alt="" aria-hidden="true" draggable="false" />` : '';
  }
  function showHighlight(root){ const h=(root||document).querySelector('.hl-img'); if(h) requestAnimationFrame(()=>h.classList.add('on')); }
  function handleTap(e, layer){
    const r = layer.getBoundingClientRect();
    const hit = hitTest(layer.dataset.scene, (e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height, r.width, Number(layer.dataset.pid));
    if(!hit) return;
    const p = CARDS.find(c=>c.id===Number(layer.dataset.pid));
    if(layer.dataset.mode==='exam'){ if(hit.id===p.id) answerExam(); else wrongExam(); }
    else showExplanation(p);
  }
  function arStyle(scene){ const s=SCENES[scene]; return `--ar:${s.w}/${s.h}`; }

  let state = {screen:'home', mode:null, reviewIndex:0, examIndex:0, score:0, hearts:3, mistakes:[], selected:null, countdown:false, search:'', answerLocked:false, examOrder:[]};
  const app = document.getElementById('app');
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"\']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  // ---- Sounds (files in assets/sounds/) ----
  const sfxCache = {};
  function sfx(file, vol=1){
    try{
      const base = sfxCache[file] || (sfxCache[file] = Object.assign(new Audio('assets/sounds/'+file),{preload:'auto'}));
      const a = base.cloneNode(true); a.volume = vol; a.play().catch(()=>{});
    }catch(e){}
  }
  let actx = null;
  const Sound = {
    correct: () => sfx('correct-bell.wav', .9),
    wrong: () => sfx('wrong-bell.wav', .9),
    pageForward: () => sfx('page-forward.wav', .9),
    pageBack: () => sfx('page-back.wav', .9),
    countdown: () => sfx('countdown.mp3', 1),
    next: () => { sfx('whoosh.wav', .8); setTimeout(()=>sfx('pop.wav', .7), 110); setTimeout(()=>sfx('ding.wav', .8), 200); },
    tick: () => { // short synthesized clock tick
      try{
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if(actx.state === 'suspended') actx.resume();
        const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square'; o.frequency.value = 900;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t+.004); g.gain.exponentialRampToValueAtTime(.0001, t+.07);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.09);
      }catch(e){}
    }
  };
  function play(name){ try{ if(Sound[name]) Sound[name](); }catch(e){} }
  function icon(name){const icons={wheel:'\u25c9',search:'\u2315',book:'\u25a4',play:'\u25b6',heart:'\u2665',back:'\u2190',home:'\u2302',info:'i',check:'\u2713',x:'\u00d7',spark:'\u2726'};return icons[name]||'\u2022';}
  function home(){state.screen='home';state.mode=null;state.search='';render();}
  function topbar(title,right=''){return `<header class="topbar"><button class="icon-btn" data-action="home">${icon('back')}</button><div><div class="brand-mini">KIA SOUL <span>2015</span></div><h1>${title}</h1></div><div class="top-right">${right}</div></header>`;}

  function renderHome(){
    app.innerHTML=`<section class="home-screen">
      <div class="brand-mark"><span class="kia">KIA</span><span class="soul">soul</span></div><div class="home-badge">2015</div>
      <h1>Explora. Toca. Aprende.</h1><p class="lead">Controles, botones y partes del interior de tu Kia Soul.</p>
      <div class="hero-photo"><img src="${SCENES.wheel.image}" alt="2015 Kia Soul interior"/><div class="photo-sheen"></div></div>
      <div class="mode-grid">
        <button class="mode-card review" data-action="review"><div class="stack-cards"><span></span><span></span><span></span></div><strong>RESE\u00d1A</strong><small>Toca una parte, res\u00e1ltala y aprende qu\u00e9 hace.</small></button>
        <button class="mode-card exam" data-action="exam"><div class="exam-icon">?</div><strong>EXAMEN</strong><small>Encuentra la parte correcta antes de pasar a la siguiente.</small></button>
      </div>
      <div class="home-stats"><span>\ud83c\udfb4 ${CARDS.length} tarjetas</span><span>\u2764\ufe0f 3 vidas</span><span>\ud83c\uddf2\ud83c\uddfd Espa\u00f1ol</span></div>
      <button class="secondary-btn" data-action="mistakes">Review all the mistakes <span>\u2192</span></button>
    </section>`;
  }

  function renderReview(){
    const pool = CARDS;
    const p=pool[state.reviewIndex%pool.length], s=SCENES[p.scene];
    app.innerHTML=`<section class="page"><div class="review-header">${topbar('RESE\u00d1A',`<span class="progress-pill">${state.reviewIndex+1}/${pool.length}</span>`)}</div>
      <div class="hint">Toca la parte en la foto. Se resaltar\u00e1 y aparecer\u00e1 su explicaci\u00f3n.</div>
      <div class="review-stage">
        <div class="photo-frame scene-${p.scene}" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${highlightLayer(p)}${hitLayer(p,'review')}<div class="scene-label">${s.title}</div></div>
        <div class="review-card"><div class="card-number">TARJETA ${state.reviewIndex+1}</div><h2>Find the <span>${esc(p.name)}</span></h2><p>Tap the part in the photo.</p><button class="yellow-btn" data-action="nextReview">Siguiente <span>\u2192</span></button></div>
      </div><div class="bottom-nav"><button data-action="home">${icon('home')} Inicio</button><button class="active">${icon('book')} Rese\u00f1a</button><button data-action="exam">${icon('play')} Examen</button></div></section>`;
  }

  function showExplanation(p){
    play('correct'); const s=SCENES[p.scene];
    const overlay=document.createElement('div'); overlay.className='explain-overlay';
    overlay.innerHTML=`<div class="cloud-backdrop"></div><div class="explain-photo" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${highlightLayer(p)}</div><div class="cloud-card"><div class="cloud-face">\u2601\ufe0f</div><div class="cloud-body"><div class="mini-tag">${esc(s.title)}</div><h2>${esc(p.name)}</h2><p>${esc(p.explanation)}</p><button class="yellow-btn" data-action="closeExplanation">Tap to exit</button></div></div>`;
    document.body.appendChild(overlay); showHighlight(overlay);
  }

  function renderExam(){
    const pool = CARDS;
    const p=currentExamPart(),s=SCENES[p.scene],cardNum=state.examIndex+1;
    app.innerHTML=`<section class="page exam-page"><div class="topbar">${topbar('EXAMEN',`<div class="exam-meta"><span class="progress-pill">${cardNum}/${pool.length}</span><span class="hearts">${'\u2665'.repeat(state.hearts)}${'\u2661'.repeat(3-state.hearts)}</span></div>`)}</div>
      <div class="game-photo photo-frame scene-${p.scene}" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${highlightLayer(p)}${hitLayer(p,'exam')}<div class="scene-label">${s.title}</div></div>
      <div class="question-card" data-card="${cardNum}"><div class="drag-handle"></div><div class="question-small">FIND THIS PART</div><div class="question-name">${esc(p.name)}</div></div>
      <div class="exam-tip">Tap the correct part in the photo.</div>
      <div class="bottom-nav"><button data-action="home">${icon('home')} Inicio</button><button data-action="review">${icon('book')} Rese\u00f1a</button><button class="active">${icon('play')} Examen</button></div></section>`;
  }

  function startExam(){const pool=CARDS;const shuffled=[...Array(pool.length).keys()];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}state.examOrder=shuffled;state.examIndex=0;state.score=0;state.hearts=3;state.mistakes=[];state.screen='countdown';renderCountdown();}
  function renderCountdown(){app.innerHTML=`<div class="countdown-screen"><div class="count-label">PREP\u00c1RATE</div><div id="count-number">3</div><div class="count-go">FIND THE PART</div></div>`;let n=3;play('countdown');const timer=setInterval(()=>{n--;if(n>0){$('#count-number').textContent=n;play('tick');}else{clearInterval(timer);$('#count-number').textContent='GO!';play('next');setTimeout(()=>{state.screen='exam';render();},650);}},850);}
  function currentExamPart(){const pool=CARDS;return pool[state.examOrder?.[state.examIndex] ?? state.examIndex];}

  function answerExam(){
    if(state.answerLocked)return; state.answerLocked=true; const p=currentExamPart(); state.score++; play('correct'); showHighlight(document.querySelector('.photo-frame'));
    const phrase=['\u00a1Correcto!','\u00a1Genial!','\u00a1Ang galing!'][Math.floor(Math.random()*3)]; const card=document.querySelector('.question-card');
    if(card) card.classList.add('card-drop'); explodeHearts(document.body);
    const feedback=document.createElement('div');feedback.className='feedback correct feedback-lite';feedback.innerHTML=`<div class="praise">${phrase}</div>`;document.body.appendChild(feedback);
    setTimeout(()=>{feedback.remove();nextExam();},850);
  }
  function wrongExam(){
    if(state.answerLocked)return;state.answerLocked=true;state.hearts=Math.max(0,state.hearts-1);const p=currentExamPart();if(!state.mistakes.find(x=>x.id===p.id))state.mistakes.push(p);play('wrong');
    const feedback=document.createElement('div');feedback.className='feedback wrong feedback-lite';feedback.innerHTML=`<div class="wrong-bubble">Try again!<small>${esc(p.name)}</small></div>`;document.body.appendChild(feedback);
    setTimeout(()=>{feedback.remove();state.answerLocked=false;render();},700);
  }
  function nextExam(){const pool=CARDS;if(state.hearts===0||state.examIndex>=pool.length-1){state.screen='results';renderResults();return;}state.examIndex++;state.answerLocked=false;render();play('next');}
  function renderResults(){const pool=CARDS;app.innerHTML=`<section class="results page">${topbar('RESULTADO')}<div class="result-card"><div class="result-emoji">\ud83c\udfc1</div><h2>\u00a1Terminaste!</h2><div class="result-score">${state.score}/${Math.min(pool.length,state.examIndex+1)}</div><p>Acertaste ${state.score} tarjetas.</p><button class="yellow-btn" data-action="exam">Jugar otra vez</button>${state.mistakes.length?`<button class="secondary-btn" data-action="mistakes">Review all the mistakes (${state.mistakes.length}) \u2192</button>`:''}</div></section>`;}
  function renderMistakes(){const pool=CARDS;const list=state.mistakes.length?state.mistakes:pool.slice(0,8);app.innerHTML=`<section class="page">${topbar('Review all the mistakes',`<span class="progress-pill">${state.mistakes.length} mistakes</span>`)}<p class="mistake-sub">Toca una tarjeta para ver la parte resaltada y recordar su funci\u00f3n.</p><div class="mistake-grid">${list.map(p=>`<button class="mistake-card" data-action="mistakeOpen" data-id="${p.id}"><span class="mistake-icon">\u2601\ufe0f</span><span>${esc(p.name)}</span><small>Tap to review</small></button>`).join('')}</div><div class="bottom-nav"><button data-action="home">${icon('home')} Inicio</button><button data-action="review">${icon('book')} Rese\u00f1a</button><button data-action="exam">${icon('play')} Examen</button></div></section>`;}
  function openMistake(id){const p=CARDS.find(x=>x.id===id)||CARDS[0],s=SCENES[p.scene];const overlay=document.createElement('div');overlay.className='explain-overlay mistake-overlay';overlay.innerHTML=`<div class="cloud-backdrop"></div><div class="explain-photo" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${highlightLayer(p)}</div><div class="cloud-card"><div class="cloud-face">\u2601\ufe0f</div><div class="cloud-body"><div class="mini-tag">REVIEW</div><h2>${esc(p.name)}</h2><p>${esc(p.explanation)}</p><button class="yellow-btn" data-action="closeExplanation">Tap to exit</button></div></div>`;document.body.appendChild(overlay);showHighlight(overlay);play('pageForward');}
  function render(){if(state.screen==='home')return renderHome();if(state.screen==='review')return renderReview();if(state.screen==='exam')return renderExam();if(state.screen==='results')return renderResults();if(state.screen==='mistakes')return renderMistakes();}
  function explodeHearts(root){for(let i=0;i<18;i++){const s=document.createElement('span');s.className='heart-pop';s.textContent=Math.random()>.3?'\u2665':'\u2726';s.style.setProperty('--x',`${(Math.random()-.5)*360}px`);s.style.setProperty('--y',`${-80-Math.random()*260}px`);s.style.setProperty('--r',`${(Math.random()-.5)*90}deg`);root.appendChild(s);setTimeout(()=>s.remove(),1200);}}
  document.addEventListener('click',e=>{const tl=e.target.closest('.tap-layer');if(tl){handleTap(e,tl);return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='home'){home();play('pageBack');}else if(a==='review'){state.screen='review';state.reviewIndex=0;render();play('pageForward');}else if(a==='nextReview'){const pool=CARDS;state.reviewIndex=(state.reviewIndex+1)%pool.length;render();play('next');}else if(a==='closeExplanation'){el.closest('.explain-overlay')?.remove();}else if(a==='exam'){startExam();}else if(a==='mistakes'){state.screen='mistakes';render();}else if(a==='mistakeOpen'){openMistake(Number(el.dataset.id));}});
  renderHome();
  </script>
</body>
</html>
