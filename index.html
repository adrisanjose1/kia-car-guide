    {id:41, section:'cluster', scene:'cluster', name:'Rear Fog Light Indicator', explanation:'Se enciende cuando la luz antiniebla trasera está activa.', box:[70.01,74.74,49.64,60.53]},

  function cardsForSection(section){ return CARDS.filter(c=>c.section===section); }
  function cardsForScene(scene){ return CARDS.filter(c=>c.scene===scene); }

  // Build a rounded-rect SVG path from a [x0,x1,y0,y1] percentage box.
  // A little outward padding makes the hit/outline area comfortable to tap.
  function shapeFor(p){
    let [x0,x1,y0,y1] = p.box;
    const pad = 1.6;
    x0 = Math.max(0, x0-pad); y0 = Math.max(0, y0-pad);
    x1 = Math.min(100, x1+pad); y1 = Math.min(100, y1+pad);
    const r = Math.min(4, (x1-x0)/2, (y1-y0)/2);
    return `M ${x0+r} ${y0} L ${x1-r} ${y0} Q ${x1} ${y0} ${x1} ${y0+r} L ${x1} ${y1-r} Q ${x1} ${y1} ${x1-r} ${y1} L ${x0+r} ${y1} Q ${x0} ${y1} ${x0} ${y1-r} L ${x0} ${y0+r} Q ${x0} ${y0} ${x0+r} ${y0} Z`;
  }
  function svgOverlay(p, mode='hidden', sceneCards=[]){
    const target = shapeFor(p);
    const others = sceneCards.filter(q=>q.id!==p.id).map(q=>
      `<path class="svg-hit other" d="${shapeFor(q)}" data-action="wrongPick" aria-label="possible part"></path>`).join('');
    const visible = mode==='visible' ? `<path class="svg-outline" d="${target}"></path>` : '';
    const targetHit = `<path class="svg-hit target" d="${target}" data-action="${mode==='exam'?'pick':'reviewAnswer'}" aria-label="${esc(p.name)}"></path>`;
    return `<svg class="hotspot-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${others}${targetHit}${visible}</svg>`;
  }
  function arStyle(scene){ const s=SCENES[scene]; return `--ar:${s.w}/${s.h}`; }

  const SECTION_INFO = {
    interior: {label:'Interior del Auto', emoji:'\ud83d\ude97', hero:'dash', tagline:'Controles, botones y partes del interior.'},
    cluster:  {label:'Tablero (Cluster)', emoji:'\ud83d\udcca', tagline:'Medidores y luces de advertencia del tablero.', hero:'cluster'}
  };

  let state = {screen:'home', section:null, mode:null, reviewIndex:0, examIndex:0, score:0, hearts:3, mistakes:[], selected:null, countdown:false, search:'', answerLocked:false, examOrder:[]};
  const app = document.getElementById('app');
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"\']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function play(name){ try { if(window.Sound && Sound[name]) Sound[name](); } catch(e){} }
  function icon(name){const icons={wheel:'\u25c9',search:'\u2315',book:'\u25a4',play:'\u25b6',heart:'\u2665',back:'\u2190',home:'\u2302',info:'i',check:'\u2713',x:'\u00d7',spark:'\u2726'};return icons[name]||'\u2022';}
  function home(){state.screen='home';state.section=null;state.mode=null;state.search='';render();}
  function pickSection(section){state.section=section;state.screen='modes';state.reviewIndex=0;state.mistakes=[];render();play('pageForward');}
  function backToModes(){state.screen='modes';render();}
  function topbar(title,right=''){return `<header class="topbar"><button class="icon-btn" data-action="${state.screen==='modes'?'home':'backToModes'}">${icon('back')}</button><div><div class="brand-mini">KIA SOUL <span>2015</span></div><h1>${title}</h1></div><div class="top-right">${right}</div></header>`;}

  function renderHome(){
    app.innerHTML=`<section class="home-screen">
      <div class="brand-mark"><span class="kia">KIA</span><span class="soul">soul</span></div><div class="home-badge">2015</div>
      <h1>Explora. Toca. Aprende.</h1><p class="lead">Elige qué parte de tu Kia Soul quieres estudiar.</p>
      <div class="hero-photo"><img src="${SCENES.dash.image}" alt="2015 Kia Soul interior"/><div class="photo-sheen"></div></div>
      <div class="section-grid">
        <button class="section-card" data-action="pickSection" data-section="interior"><span class="section-emoji">\ud83d\ude97</span><strong>Interior del Auto</strong><small>${cardsForSection('interior').length} tarjetas · botones, controles y partes</small></button>
        <button class="section-card" data-action="pickSection" data-section="cluster"><span class="section-emoji">\ud83d\udcca</span><strong>Tablero (Cluster)</strong><small>${cardsForSection('cluster').length} tarjetas · medidores y luces</small></button>
      </div>
      <div class="home-stats"><span>\ud83c\udfb4 ${CARDS.length} tarjetas en total</span><span>\u2764\ufe0f 3 vidas</span><span>\ud83c\uddf2\ud83c\uddfd Espa\u00f1ol</span></div>
    </section>`;
  }

  function renderModes(){
    const info = SECTION_INFO[state.section];
    const pool = cardsForSection(state.section);
    app.innerHTML=`<section class="home-screen">
      <button class="icon-btn" data-action="home" style="position:absolute;left:16px;top:16px">${icon('back')}</button>
      <div class="section-pill">${info.emoji} ${info.label}</div>
      <h1>${info.label}</h1><p class="lead">${info.tagline}</p>
      <div class="hero-photo"><img src="${SCENES[info.hero].image}" alt="${info.label}"/><div class="photo-sheen"></div></div>
      <div class="mode-grid">
        <button class="mode-card review" data-action="review"><div class="stack-cards"><span></span><span></span><span></span></div><strong>RESE\u00d1A</strong><small>Toca una parte, res\u00e1ltala y aprende qu\u00e9 hace.</small></button>
        <button class="mode-card exam" data-action="exam"><div class="exam-icon">?</div><strong>EXAMEN</strong><small>Encuentra la parte correcta antes de pasar a la siguiente.</small></button>
      </div>
      <div class="home-stats"><span>\ud83c\udfb4 ${pool.length} tarjetas</span><span>\u2764\ufe0f 3 vidas</span><span>\ud83c\uddf2\ud83c\uddfd Espa\u00f1ol</span></div>
      <button class="secondary-btn" data-action="mistakes">Review all the mistakes <span>\u2192</span></button>
    </section>`;
  }

  function renderReview(){
    const pool = cardsForSection(state.section);
    const p=pool[state.reviewIndex%pool.length], s=SCENES[p.scene], sceneCards=cardsForScene(p.scene);
    app.innerHTML=`<section class="page"><div class="review-header">${topbar('RESE\u00d1A',`<span class="progress-pill">${state.reviewIndex+1}/${pool.length}</span>`)}</div>
      <div class="hint">Toca la parte en la foto. Se resaltar\u00e1 y aparecer\u00e1 su explicaci\u00f3n.</div>
      <div class="review-stage">
        <div class="photo-frame scene-${p.scene}" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${svgOverlay(p,'hidden',sceneCards)}<div class="scene-label">${s.title}</div></div>
        <div class="review-card"><div class="card-number">TARJETA ${state.reviewIndex+1}</div><h2>Find the <span>${esc(p.name)}</span></h2><p>Tap the part in the photo.</p><button class="yellow-btn" data-action="nextReview">Siguiente <span>\u2192</span></button></div>
      </div><div class="bottom-nav"><button data-action="home">${icon('home')} Inicio</button><button class="active">${icon('book')} Rese\u00f1a</button><button data-action="exam">${icon('play')} Examen</button></div></section>`;
  }

  function showExplanation(p){
    play('correct'); const s=SCENES[p.scene];
    const overlay=document.createElement('div'); overlay.className='explain-overlay';
    overlay.innerHTML=`<div class="cloud-backdrop"></div><div class="explain-photo" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${svgOverlay(p,'visible',cardsForScene(p.scene))}</div><div class="cloud-card"><div class="cloud-face">\u2601\ufe0f</div><div class="cloud-body"><div class="mini-tag">${esc(s.title)}</div><h2>${esc(p.name)}</h2><p>${esc(p.explanation)}</p><button class="yellow-btn" data-action="closeExplanation">Tap to exit</button></div></div>`;
    document.body.appendChild(overlay);
  }

  function renderExam(){
    const pool = cardsForSection(state.section);
    const p=currentExamPart(),s=SCENES[p.scene],cardNum=state.examIndex+1,sceneCards=cardsForScene(p.scene);
    app.innerHTML=`<section class="page exam-page"><div class="topbar">${topbar('EXAMEN',`<div class="exam-meta"><span class="progress-pill">${cardNum}/${pool.length}</span><span class="hearts">${'\u2665'.repeat(state.hearts)}${'\u2661'.repeat(3-state.hearts)}</span></div>`)}</div>
      <div class="game-photo photo-frame scene-${p.scene}" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${svgOverlay(p,'exam',sceneCards)}<div class="scene-label">${s.title}</div></div>
      <div class="question-card" data-card="${cardNum}"><div class="drag-handle"></div><div class="question-small">FIND THIS PART</div><div class="question-name">${esc(p.name)}</div></div>
      <div class="exam-tip">Tap the correct part in the photo.</div>
      <div class="bottom-nav"><button data-action="home">${icon('home')} Inicio</button><button data-action="review">${icon('book')} Rese\u00f1a</button><button class="active">${icon('play')} Examen</button></div></section>`;
  }

  function startExam(){const pool=cardsForSection(state.section);const shuffled=[...Array(pool.length).keys()];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}state.examOrder=shuffled;state.examIndex=0;state.score=0;state.hearts=3;state.mistakes=[];state.screen='countdown';renderCountdown();}
  function renderCountdown(){app.innerHTML=`<div class="countdown-screen"><div class="count-label">PREP\u00c1RATE</div><div id="count-number">3</div><div class="count-go">FIND THE PART</div></div>`;let n=3;play('countdown');const timer=setInterval(()=>{n--;if(n>0){$('#count-number').textContent=n;play('tick');}else{clearInterval(timer);$('#count-number').textContent='GO!';play('next');setTimeout(()=>{state.screen='exam';render();},650);}},850);}
  function currentExamPart(){const pool=cardsForSection(state.section);return pool[state.examOrder?.[state.examIndex] ?? state.examIndex];}

  function answerExam(){
    if(state.answerLocked)return; state.answerLocked=true; const p=currentExamPart(); state.score++; play('correct');
    const phrase=['\u00a1Correcto!','\u00a1Genial!','\u00a1Ang galing!'][Math.floor(Math.random()*3)]; const card=document.querySelector('.question-card');
    if(card) card.classList.add('card-drop'); explodeHearts(document.body);
    const feedback=document.createElement('div');feedback.className='feedback correct feedback-lite';feedback.innerHTML=`<div class="praise">${phrase}</div>`;document.body.appendChild(feedback);
    setTimeout(()=>{feedback.remove();nextExam();},850);
  }
  function wrongExam(){
    if(state.answerLocked)return;state.answerLocked=true;state.hearts=Math.max(0,state.hearts-1);const p=currentExamPart();if(!state.mistakes.find(x=>x.id===p.id))state.mistakes.push(p);play('wrong');
    const feedback=document.createElement('div');feedback.className='feedback wrong feedback-lite';feedback.innerHTML=`<div class="wrong-bubble">Try again!<small>${esc(p.name)}</small></div>`;document.body.appendChild(feedback);
    setTimeout(()=>{feedback.remove();state.answerLocked=false;render();},700);
  }
  function nextExam(){const pool=cardsForSection(state.section);if(state.hearts===0||state.examIndex>=pool.length-1){state.screen='results';renderResults();return;}state.examIndex++;state.answerLocked=false;render();play('next');}
  function renderResults(){const pool=cardsForSection(state.section);app.innerHTML=`<section class="results page">${topbar('RESULTADO')}<div class="result-card"><div class="result-emoji">\ud83c\udfc1</div><h2>\u00a1Terminaste!</h2><div class="result-score">${state.score}/${Math.min(pool.length,state.examIndex+1)}</div><p>Acertaste ${state.score} tarjetas.</p><button class="yellow-btn" data-action="exam">Jugar otra vez</button>${state.mistakes.length?`<button class="secondary-btn" data-action="mistakes">Review all the mistakes (${state.mistakes.length}) \u2192</button>`:''}</div></section>`;}
  function renderMistakes(){const pool=cardsForSection(state.section);const list=state.mistakes.length?state.mistakes:pool.slice(0,8);app.innerHTML=`<section class="page">${topbar('Review all the mistakes',`<span class="progress-pill">${state.mistakes.length} mistakes</span>`)}<p class="mistake-sub">Toca una tarjeta para ver la parte resaltada y recordar su funci\u00f3n.</p><div class="mistake-grid">${list.map(p=>`<button class="mistake-card" data-action="mistakeOpen" data-id="${p.id}"><span class="mistake-icon">\u2601\ufe0f</span><span>${esc(p.name)}</span><small>Tap to review</small></button>`).join('')}</div><div class="bottom-nav"><button data-action="home">${icon('home')} Inicio</button><button data-action="review">${icon('book')} Rese\u00f1a</button><button data-action="exam">${icon('play')} Examen</button></div></section>`;}
  function openMistake(id){const p=CARDS.find(x=>x.id===id)||CARDS[0],s=SCENES[p.scene];const overlay=document.createElement('div');overlay.className='explain-overlay mistake-overlay';overlay.innerHTML=`<div class="cloud-backdrop"></div><div class="explain-photo" style="${arStyle(p.scene)}"><img src="${s.image}" alt="${s.title}"/>${svgOverlay(p,'visible',cardsForScene(p.scene))}</div><div class="cloud-card"><div class="cloud-face">\u2601\ufe0f</div><div class="cloud-body"><div class="mini-tag">REVIEW</div><h2>${esc(p.name)}</h2><p>${esc(p.explanation)}</p><button class="yellow-btn" data-action="closeExplanation">Tap to exit</button></div></div>`;document.body.appendChild(overlay);play('pageForward');}
  function render(){if(state.screen==='home')return renderHome();if(state.screen==='modes')return renderModes();if(state.screen==='review')return renderReview();if(state.screen==='exam')return renderExam();if(state.screen==='results')return renderResults();if(state.screen==='mistakes')return renderMistakes();}
  function explodeHearts(root){for(let i=0;i<18;i++){const s=document.createElement('span');s.className='heart-pop';s.textContent=Math.random()>.3?'\u2665':'\u2726';s.style.setProperty('--x',`${(Math.random()-.5)*360}px`);s.style.setProperty('--y',`${-80-Math.random()*260}px`);s.style.setProperty('--r',`${(Math.random()-.5)*90}deg`);root.appendChild(s);setTimeout(()=>s.remove(),1200);}}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='home'){home();play('pageBack');}else if(a==='pickSection'){pickSection(el.dataset.section);}else if(a==='backToModes'){backToModes();play('pageBack');}else if(a==='review'){state.screen='review';state.reviewIndex=0;render();play('pageForward');}else if(a==='nextReview'){const pool=cardsForSection(state.section);state.reviewIndex=(state.reviewIndex+1)%pool.length;render();play('next');}else if(a==='reviewAnswer'){const pool=cardsForSection(state.section);const p=pool[state.reviewIndex%pool.length];showExplanation(p);}else if(a==='closeExplanation'){el.closest('.explain-overlay')?.remove();}else if(a==='exam'){startExam();}else if(a==='pick'){answerExam();}else if(a==='wrongPick'){wrongExam();}else if(a==='mistakes'){state.screen='mistakes';render();}else if(a==='mistakeOpen'){openMistake(Number(el.dataset.id));}});
  renderHome();
  </script>
</body>
</html>
